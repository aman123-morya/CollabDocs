# Local/demo stack: PostgreSQL + backend + frontend.
#   docker compose up --build
# Then open http://localhost:5173  (backend: http://localhost:8080)
#
# Generate a real JWT secret before running this anywhere but your laptop:
#   openssl rand -base64 48
name: collabdocs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: texteditor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/texteditor
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file, e.g. output of: openssl rand -base64 48}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
