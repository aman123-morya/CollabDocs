spring:
  application:
    name: collabdocs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/texteditor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false          # no lazy loading in controllers -> fewer surprise queries
    hibernate:
      ddl-auto: none             # the schema is owned by Flyway (db/migration)
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET_KEY}                     # REQUIRED: base64, >= 256 bit  (openssl rand -base64 48)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 h
  autosave-interval-ms: ${AUTOSAVE_INTERVAL_MS:15000}

logging:
  level:
    com.devansh: ${LOG_LEVEL:info}
